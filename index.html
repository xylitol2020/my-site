<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 学习辅助大师</title>
<style>
:root {
    --bg: #EDEFF4;
    --surface: #FFFFFF;
    --surface-2: #F7F8FB;
    --line: #E4E7EE;
    --line-soft: #EEF0F5;
    --text: #1A1D2E;
    --text-2: #6B7185;
    --muted: #9AA0B3;
    --danger: #EF4444;
    --ok: #10B981;
    --warn: #F59E0B;
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-full: 999px;
    --shadow-1: 0 1px 3px rgba(16,24,40,.05);
    --shadow-2: 0 6px 20px rgba(16,24,40,.09);
    --shadow-3: 0 16px 40px rgba(16,24,40,.14);
}

[data-theme="dark"] {
    --bg: #0E1017;
    --surface: #1B1E2B;
    --surface-2: #232736;
    --line: #2C3040;
    --line-soft: #262A3A;
    --text: #E9EBF1;
    --text-2: #9BA1B5;
    --muted: #5E6478;
    --shadow-1: 0 1px 3px rgba(0,0,0,.3);
    --shadow-2: 0 6px 20px rgba(0,0,0,.4);
    --shadow-3: 0 16px 40px rgba(0,0,0,.55);
}

/* 每个模式独立 accent 色 */
.app[data-accent="image"]     { --accent:#F97316; --accent-hover:#EA580C; --accent-soft:rgba(249,115,22,.12);  --accent-grad:linear-gradient(135deg,#F97316,#FB923C); }
.app[data-accent="video"]     { --accent:#10B981; --accent-hover:#059669; --accent-soft:rgba(16,185,129,.12);  --accent-grad:linear-gradient(135deg,#10B981,#34D399); }
.app[data-accent="ppt"]       { --accent:#8B5CF6; --accent-hover:#7C3AED; --accent-soft:rgba(139,92,246,.12);  --accent-grad:linear-gradient(135deg,#8B5CF6,#A78BFA); }
.app[data-accent="assistant"] { --accent:#4F6BF6; --accent-hover:#3B54D9; --accent-soft:rgba(79,107,246,.12);  --accent-grad:linear-gradient(135deg,#4F6BF6,#818CF8); }
.app[data-accent="more"]      { --accent:#EF4444; --accent-hover:#DC2626; --accent-soft:rgba(239,68,68,.12);  --accent-grad:linear-gradient(135deg,#EF4444,#F87171); }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: background .2s;
}

.app {
    --accent: #4F6BF6; --accent-hover: #3B54D9; --accent-soft: rgba(79,107,246,.12); --accent-grad: linear-gradient(135deg,#4F6BF6,#818CF8);
    width: 100%;
    max-width: 960px;
    height: 94vh;
    max-height: 900px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow-3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
    width: 36px; height: 36px;
    background: var(--accent-grad);
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
    flex-shrink: 0;
}

.brand-name { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; }

.brand-mode {
    font-size: 12px; color: var(--text-2);
    margin-top: 1px;
    display: flex; align-items: center; gap: 5px;
}

.brand-mode b { color: var(--accent); font-weight: 600; }

.actions { display: flex; gap: 4px; flex-shrink: 0; }

.icon-btn {
    width: 34px; height: 34px;
    border: none; border-radius: 9px;
    background: transparent; color: var(--text-2);
    cursor: pointer; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
}

.icon-btn:hover { background: var(--surface-2); color: var(--text); }

[title] { position: relative; }

/* 模式导航 */
.mode-bar {
    display: flex; gap: 6px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line-soft);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
}

.mode-bar::-webkit-scrollbar { display: none; }

.mode-tab {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
}

.mode-tab .tab-emoji { font-size: 14px; }

.mode-tab:hover { border-color: var(--accent); color: var(--accent); }

.mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
}

.tab-count {
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px; font-weight: 600; font-style: normal;
    display: none; align-items: center; justify-content: center;
}

.mode-tab.active .tab-count { background: rgba(255,255,255,.25); color: #fff; }
.mode-tab .tab-count.show { display: inline-flex; }

/* 聊天区 */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar { width: 5px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
.chat::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* 欢迎页 */
.welcome {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 30px 18px;
    min-height: 220px;
    animation: rise .4s ease;
}

.welcome-mark {
    width: 76px; height: 76px;
    background: var(--accent-grad);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    margin-bottom: 18px;
}

.welcome h3 { font-size: 21px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

.welcome p { font-size: 13.5px; color: var(--text-2); line-height: 1.7; max-width: 440px; }

.welcome-note {
    margin-top: 12px;
    padding: 5px 14px;
    border-radius: var(--r-full);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 500;
}

.welcome-tips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }

.welcome-tip {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
    transition: all .18s;
}

.welcome-tip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* 消息 */
.msg { display: flex; gap: 10px; max-width: 84%; animation: rise .25s ease; }

.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.bot { align-self: flex-start; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.av {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0; margin-top: 2px;
}

.msg.user .av { background: var(--accent-grad); }
.msg.bot .av { background: var(--accent-soft); }

.c { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.bubble {
    padding: 11px 15px;
    font-size: 14.5px;
    line-height: 1.7;
    word-break: break-word;
}

.msg.user .bubble {
    background: var(--accent);
    color: #fff;
    border-radius: 18px 18px 6px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.16);
}

.msg.bot .bubble {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 18px 18px 18px 6px;
    box-shadow: var(--shadow-1);
}

.msg-meta {
    display: flex; align-items: center; gap: 8px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0;
    transition: opacity .2s;
}

.msg.user .msg-meta { flex-direction: row-reverse; }
.msg:hover .msg-meta { opacity: 1; }

.mini-btn {
    border: none; background: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    transition: all .15s;
}

.mini-btn:hover { background: var(--surface-2); color: var(--text-2); }

/* 用户消息内的附件徽标 */
.file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.28); }

.file-chip {
    padding: 4px 11px;
    background: rgba(255,255,255,.18);
    border-radius: var(--r-full);
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

/* Markdown 渲染 */
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md strong { font-weight: 600; }
.md em { font-style: italic; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md code {
    font-family: "SF Mono", "Consolas", monospace;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 13px;
}
.md pre { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.md pre .ch { display: flex; justify-content: space-between; align-items: center; padding: 5px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.md pre .ch .cc { border: none; background: none; color: var(--text-2); cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 5px; }
.md pre .ch .cc:hover { background: var(--accent-soft); color: var(--accent); }
.md pre code { display: block; padding: 13px; overflow-x: auto; background: var(--surface); border: none; font-size: 13px; line-height: 1.6; }
.md blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 14px; margin: 8px 0; border-radius: 0 8px 8px 0; color: var(--text-2); font-size: 13.5px; }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md img { max-width: 100%; height: auto; border-radius: 10px; margin: 8px 0; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
.md table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; }
.md th { background: var(--surface-2); font-weight: 600; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 8px; font-weight: 600; line-height: 1.4; color: var(--text); }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 15px; }

/* 打字指示器 */
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.3s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

/* 底部编辑器 */
.editor {
    padding: 10px 18px 12px;
    border-top: 1px solid var(--line-soft);
    background: var(--surface);
    flex-shrink: 0;
}

.composer {
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1.5px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface-2);
    transition: border-color .18s, background .18s, box-shadow .18s;
}

.composer:focus-within, .composer.dragover { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }

.attach-preview { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 12px 0; }
.attach-preview.show { display: flex; }

.att {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-1);
    animation: rise .2s ease;
}

.att-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line-soft); background: var(--surface-2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--accent); }

.att-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.att-name { font-size: 12px; color: var(--text); font-weight: 500; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.att-size { font-size: 11px; color: var(--muted); }

.att-del { border: none; background: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 2px 3px; border-radius: 5px; transition: all .15s; flex-shrink: 0; }
.att-del:hover { background: var(--danger); color: #fff; }

.row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 8px 10px 8px 16px;
}

#input {
    flex: 1;
    min-width: 0;
    border: none; outline: none; resize: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px; line-height: 1.55;
    padding: 9px 0;
    min-height: 24px; max-height: 120px;
}

#input::placeholder { color: var(--muted); }

.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
}

.round-btn {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .18s;
    flex-shrink: 0;
}

#attach { background: var(--surface); border: 1px solid var(--line); color: var(--text-2); font-size: 17px; }
#attach:hover { border-color: var(--accent); color: var(--accent); }
#attach.hidden { display: none; }

#send {
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
#send:hover { background: var(--accent-hover); transform: scale(1.04); }
#send.stop { background: var(--danger); }
#send.stop:hover { background: #DC2626; }

.hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

/* 附件菜单（悬浮在工具栏按钮上方） */
.menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    min-width: 250px;
    max-width: calc(100vw - 40px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-2);
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 30;
    animation: rise .15s ease;
}

.menu.open { display: flex; }

.menu-item {
    border: none; background: none;
    padding: 10px 12px;
    border-radius: 9px;
    text-align: left;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background .15s, color .15s;
    font-family: inherit;
}

.menu-item:hover { background: var(--accent-soft); color: var(--accent); }

.menu-div { height: 1px; background: var(--line-soft); margin: 4px 0; }

.menu-url { display: flex; gap: 6px; padding: 6px 4px; }

.menu-url input {
    flex: 1; min-width: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    padding: 8px 12px;
    font-size: 12.5px;
    outline: none;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color .15s;
}

.menu-url input:focus { border-color: var(--accent); }
.menu-url input::placeholder { color: var(--muted); }

.menu-url button {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-full);
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
}
.menu-url button:hover { background: var(--accent-hover); }

/* Toast */
.toasts { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

.toast {
    padding: 10px 20px;
    border-radius: var(--r-full);
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    box-shadow: var(--shadow-2);
    animation: rise .3s ease, fadeout .3s ease 2.5s forwards;
    pointer-events: auto;
    white-space: nowrap;
}

.toast.ok { background: var(--ok); }
.toast.err { background: var(--danger); }
.toast.info { background: var(--accent); }
.toast.warn { background: var(--warn); color: #333; }

@keyframes fadeout { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

/* 响应式 */
@media (max-width: 640px) {
    body { padding: 0; }
    .app { height: 100vh; max-height: none; border-radius: 0; border: none; }
    .chat { padding: 14px; }
    .msg { max-width: 90%; }
    .mode-tab { padding: 6px 11px; font-size: 12px; }
    .header { padding: 10px 14px; }
    .editor { padding: 8px 12px 10px; }
}

@media print {
    body { background: #fff; }
    .app { box-shadow: none; border: none; height: auto; max-height: none; }
    .editor, .mode-bar, .actions, .msg-meta { display: none !important; }
    .chat { overflow: visible; }
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app" data-accent="assistant">
    <header class="header">
        <div class="brand">
            <div class="brand-mark" id="brand-mark">AI</div>
            <div>
                <div class="brand-name">AI 学习辅助大师</div>
                <div class="brand-mode"><span id="mode-name">学习总结</span></div>
            </div>
        </div>
        <div class="actions">
            <button class="icon-btn" id="theme" title="切换主题">🌓</button>
            <button class="icon-btn" id="new-chat" title="新建当前模式对话">🔄</button>
            <button class="icon-btn" id="clear" title="清空当前模式历史">🗑️</button>
        </div>
    </header>

    <nav class="mode-bar" id="mode-bar"></nav>

    <div class="chat" id="chat"></div>

    <div class="editor">
        <div class="composer" id="composer">
            <div class="attach-preview" id="attach-preview"></div>
            <div class="row">
                <textarea id="input" rows="1" placeholder="向 AI 提问…"></textarea>
                <div class="toolbar">
                    <button class="round-btn" id="attach" title="上传文件 / 图片">📎</button>
                    <button class="round-btn" id="send" title="发送 (Enter)">➤</button>
                    <input type="file" id="file" accept="*/*" multiple hidden>
                    <div class="menu" id="menu">
                        <button class="menu-item" id="menu-local">📎 上传本地文件 / 图片</button>
                        <div class="menu-div"></div>
                        <div class="menu-url">
                            <input id="menu-url" placeholder="粘贴文件 URL 回车添加" />
                            <button id="menu-add">添加</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="hint">Enter 发送 · Shift+Enter 换行 · </div>
    </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function () {
    'use strict';

    /* ============ 配置 ============ */
    /* baseUrl / apiKey 填写你的 Dify 服务地址与应用密钥。
       也可通过 URL 参数注入（优先级更高）：
         ?base=https://your.server/v1&image=app-xxx&video=app-xxx&ppt=app-xxx&assistant=app-xxx&more=app-xxx
       未配置时页面仍可完整使用，仅发送时提示。 */
    var CONFIG = {
        baseUrl: 'http://192.168.88.100/v1',
        apiKeys: {
            image: 'app-AIYWFRkXFYye9pmdQKeB4SVe',
            video: 'app-nADdlaWbyWNsnmb1BjXpz9Dz',

    /* ============ 轻量 Markdown（零依赖） ============ */
    var MD_CODE = [];

    function mdInline(t, escapeHref) {
        t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) {
            return '<img src="' + esc(src) + '" alt="' + esc(alt || '图片') + '" loading="lazy">';
        });
        t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/(^|[\s*_])\*([^*\n]+)\*(?=$|[\s*_])/g, '$1<em>$2</em>');
        t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
            var safe = /^(https?:)?\/\//i.test(href) || /^[\w\-.~/]+$/.test(href) || href.indexOf('#') === 0;
            return '<a href="' + (safe ? href : '#') + '" target="_blank" rel="noopener">' + label + '</a>';
        });
        return t;
    }

    function isImageUrl(u) {
        var p = u.toLowerCase().split('?')[0];
        return /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/.test(p) ||
               /(alipayobjects|alicdn|oss|s3|cloudinary|githubusercontent|iwiki|coding|img[0-9]*)\./.test(p) ||
               p.indexOf('/img/') !== -1 || p.indexOf('/charts/') !== -1 || p.indexOf('/chart/') !== -1;
    }

    function mdBuildTable(header, rows) {
        var cells = function (line) {
            line = line.trim();
            if (line.charAt(0) === '|') line = line.slice(1);
            if (line.charAt(line.length - 1) === '|') line = line.slice(0, -1);
            return line.split('|').map(function (c) { return c.trim(); });
        };
        var h = cells(header);
        var htm = '<table><thead><tr>';
        h.forEach(function (c) { htm += '<th>' + mdInline(c) + '</th>'; });
        htm += '</tr></thead><tbody>';
        rows.forEach(function (r) {
            var cs = cells(r);
            htm += '<tr>';
            for (var i = 0; i < h.length; i++) htm += '<td>' + mdInline(cs[i] || '') + '</td>';
            htm += '</tr>';
        });
        return htm + '</tbody></table>';
    }

    function md(src) {
        if (!src) return '';
        MD_CODE = [];
        src = src.replace(/```(?:([\w\-+.]+))?\s*\n([\s\S]*?)```/g, function (m, lang, code) {
            MD_CODE.push('<pre><div class="ch"><span>' + esc(lang || 'code') + '</span><button class="cc" onclick="window.__cc(this)">复制</button></div><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
            return '\u0000B' + (MD_CODE.length - 1) + '\u0000';
        });

        var lines = src.split('\n');
        var html = '';
        var para = [];
        var listType = null;

        function flushPara() {
            if (para.length) {
                html += '<p>' + para.map(mdInline).join('<br>') + '</p>';
                para = [];
            }
        }
        function flushList() {
            if (listType) { html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; }
        }

        function isFence(l) { return /^\u0000B\d+\u0000$/.test(l); }

        for (var i = 0; i < lines.length; i++) {
            var raw = lines[i];

            if (isFence(raw)) {
                flushPara(); flushList();
                html += MD_CODE[+raw.slice(2, -2)];
                continue;
            }
            if (!raw.trim()) { flushPara(); flushList(); continue; }

            var h = raw.match(/^(#{1,4})[ \t]+(.*)$/);
            if (h) {
                flushPara(); flushList();
                var lvl = h[1].length;
                html += '<h' + lvl + '>' + mdInline(h[2]) + '</h' + lvl + '>';
                continue;
            }

            if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) {
                flushPara(); flushList();
                html += '<hr>';
                continue;
            }

            if (/^\s*>\s?/.test(raw)) {
                flushPara(); flushList();
                var q = [raw.replace(/^\s*>\s?/, '')];
                while (i + 1 < lines.length && /^\s*>\s?/.test(lines[i + 1])) {
                    i++;
                    q.push(lines[i].replace(/^\s*>\s?/, ''));
                }
                html += '<blockquote>' + q.map(mdInline).join('<br>') + '</blockquote>';
                continue;
            }

            /* 表格：当前行含 | 且下一行为分隔行 */
            if (raw.indexOf('|') !== -1 && i + 1 < lines.length) {
                var sep = lines[i + 1].trim();
                if (/^\|?[\s:\-|]+\|?$/.test(sep) && sep.indexOf('-') !== -1) {
                    flushPara(); flushList();
                    var rows = [];
                    i += 2;
                    while (i < lines.length && lines[i].trim() !== '' && lines[i].indexOf('|') !== -1) {
                        rows.push(lines[i]);
                        i++;
                    }
                    i--;
                    html += mdBuildTable(raw, rows);
                    continue;
                }
            }

            /* 行内图片 URL（拿到了链接就直接展示为图片） */
            var mUrl = raw.match(/(https?:\/\/[^\s<>"'()]+)/i);
            if (mUrl && isImageUrl(mUrl[1])) {
                flushPara(); flushList();
                var u = mUrl[1];
                var pre = raw.slice(0, mUrl.index).trim();
                var post = raw.slice(mUrl.index + u.length).trim();
                if (pre || post) {
                    html += '<p>' + mdInline(pre) + '<img src="' + esc(u) + '" alt="图片" loading="lazy" onclick="window.open(this.currentSrc || this.src)">' + mdInline(post) + '</p>';
                } else {
                    html += '<img src="' + esc(u) + '" alt="图片" loading="lazy" onclick="window.open(this.currentSrc || this.src)">';
                }
                continue;
            }

            if (/^\s*[-*+][ \t]+\S/.test(raw)) {
                flushPara();
                if (listType !== 'ul') { flushList(); html += '<ul>'; listType = 'ul'; }
                html += '<li>' + mdInline(raw.replace(/^\s*[-*+][ \t]+/, '')) + '</li>';
                continue;
            }

            if (/^\s*\d+\.\s+\S/.test(raw)) {
                flushPara();
                if (listType !== 'ol') { flushList(); html += '<ol>'; listType = 'ol'; }
                html += '<li>' + mdInline(raw.replace(/^\s*\d+\.\s+/, '')) + '</li>';
                continue;
            }

            para.push(raw);
        }

        flushPara(); flushList();
        return '<div class="md">' + html + '</div>';
    }

    /* ============ 发送（文字 + 附件一起提交） ============ */
    function buildPayload(s, images) {
        var payload = [];
        s.files.forEach(function (f) {
            if (f instanceof File) {
                var item = { type: 'local', name: f.name, size: f.size, mime: f.type || '' };
                if (f.type && f.type.indexOf('image/') === 0 && f._data) images.push(f._data);
                payload.push(item);
            } else {
                payload.push({ type: 'url', url: f });
            }
        });
        return payload;
    }

    /* ============ Dify 文件上传（新增：把本地文件真正上传到 Dify，拿到 upload_file_id） ============ */
    function uploadFileToDify(file) {
        var fd = new FormData();
        fd.append('file', file, file.name);
        fd.append('user', USER_ID);
        return fetch(CONFIG.baseUrl + '/files/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + CONFIG.apiKeys[current] },
            body: fd,
            signal: controller ? controller.signal : undefined
        }).then(function (resp) {
            if (!resp.ok) throw new Error('upload ' + resp.status);
            return resp.json();
        }).then(function (data) {
            if (!data || !data.id) throw new Error('no id');
            return data.id;
        });
    }

    function typeOfFile(f) {
        var name = f.name || '';
        if (f.type && f.type.indexOf('image/') === 0) return 'image';
        if (/(\.png|\.jpe?g|\.gif|\.webp|\.svg|\.bmp|\.avif)$/i.test(name)) return 'image';
        if (/(\.mp3|\.wav|\.ogg|\.m4a|\.aac|\.flac)$/i.test(name)) return 'audio';
        if (/(\.mp4|\.webm|\.mov|\.avi|\.mkv|\.flv)$/i.test(name)) return 'video';
        return 'document';
    }

    async function uploadAttachments(fileList) {
        var out = [];
        for (var i = 0; i < fileList.length; i++) {
            var f = fileList[i];
            if (f instanceof File) {
                try {
                    var id = await uploadFileToDify(f);
                    out.push({ type: typeOfFile(f), transfer_method: 'local_file', upload_file_id: id });
                } catch (e) {
                    out.push(null);
                    toast('文件上传失败：' + f.name, 'err');
                }
            } else {
                out.push({ type: 'document', transfer_method: 'remote_url', url: String(f) });
            }
        }
        return out;
    }

    function abortStream() {
        if (controller) { controller.abort(); }
    }

    function setSendIdle() {
        streaming = false;
        controller = null;
        send.textContent = '➤';
        send.classList.remove('stop');
        send.title = '发送 (Enter)';
        send.disabled = false;

    async function doSend() {
        var s = S();
        var text = input.value.trim();
        if ((!text && !s.files.length) || streaming) return;

        if (!CONFIG.baseUrl || !CONFIG.apiKeys[current]) {
            toast('请先在 CONFIG 中填写 baseUrl / apiKey', 'warn');
            return;
        }

        input.value = '';
        s.draft = '';
        autoGrow();

        var images = [];
        var filesSnapshot = s.files.slice();
        var payload = buildPayload(s, images);
        var ts = Date.now();

        pushMessage({ role: 'user', content: text, files: payload, ts: ts });

        clearFiles();

        streaming = true;
        controller = new AbortController();
        send.textContent = '⏹';
        send.classList.add('stop');
        send.title = '停止生成';

        var bubble = msgNode({ role: 'bot', content: '', ts: ts }).querySelector('.bubble');
        bubble.classList.add('md');
        bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        chat.appendChild(bubble.closest('.msg'));
        scrollDown();

        var uploadedFiles = filesSnapshot.length ? await uploadAttachments(filesSnapshot) : [];

        var uploadedFileObjs = uploadedFiles.filter(function (f) { return !!f; });
        var body = {
            inputs: { uploaded_files: uploadedFileObjs },
            query: text,
            response_mode: 'streaming',
            conversation_id: s.conversationId,
            user: USER_ID
        };
        if (uploadedFileObjs.length) body.files = uploadedFileObjs;
        if (images.length) body.inputs.images = images;

        var full = '';

        try {
            var resp = await fetch(CONFIG.baseUrl + '/chat-messages', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + CONFIG.apiKeys[current],
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body),
                signal: controller.signal
            });

            if (!resp.ok) {
                var t = await resp.text().catch(function () { return ''; });
                throw new Error('HTTP ' + resp.status + (t ? ': ' + t : ''));
            }

            var reader = resp.body.getReader();
            var decoder = new TextDecoder();
            var buf = '';

            while (true) {
                var r = await reader.read();
                if (r.done) { break; }
                buf += decoder.decode(r.value, { stream: true });
                var lines = buf.split('\n');
                buf = lines.pop() || '';
                for (var i = 0; i < lines.length; i++) {
                    if (lines[i].indexOf('data: ') !== 0) continue;
                    var raw = lines[i].slice(6).trim();
                    if (raw === '[DONE]') continue;
                    try {
                        var d = JSON.parse(raw);
                        if ((d.event === 'message' || d.event === 'agent_message') && d.answer) {
                            full += d.answer;
                            bubble.innerHTML = md(full);
                            scrollDown();
                        }
                        if (d.conversation_id && !s.conversationId) {
                            s.conversationId = d.conversation_id;
                        }
                    } catch (e) {}
                }
            }
            finish(full);
        } catch (err) {
            if (err && err.name === 'AbortError') { finish(full); return; }
            finish('', err && err.message ? err.message : '未知错误');
        }

        function finish(answer, errMsg) {
            var node = bubble.closest('.msg');
            if (errMsg) {
                S().messages.push({ role: 'bot', content: '❌ 请求失败：' + errMsg, ts: ts });
                refreshCounts();
                save();
                node.querySelector('.bubble').innerHTML = md('❌ 请求失败：' + esc(errMsg));
                toast('请求失败：' + errMsg, 'err');
                setSendIdle();
                return;
            }
            if (answer) {
                bubble.innerHTML = md(answer);
                S().messages.push({ role: 'bot', content: answer, ts: ts });
                refreshCounts();
                save();
                var meta = node.querySelector('.msg-meta');
                if (meta) {
                    var copy = document.createElement('button');
                    copy.className = 'mini-btn';
                    copy.textContent = '复制';
                    copy.addEventListener('click', function () { whatACopy(answer); toast('已复制', 'ok'); });
                    meta.appendChild(copy);
                }
            } else {
                S().messages.push({ role: 'bot', content: '⚠️ 未收到回复，请检查 API 配置', ts: ts });
                refreshCounts();
                save();
                node.querySelector('.bubble').innerHTML = md('⚠️ 未收到回复，请检查 API 配置');
            }
            setSendIdle();
        }
    }

    /* ============ 附件管理 ============ */
    function addFiles(list) {
        var s = S();
        if (!MODES[current].upload) { toast('仅「学习总结 / 错题录入」支持上传', 'warn'); return; }
        var added = 0;
        for (var i = 0; i < list.length; i++) {
            var f = list[i];
            if (s.files.length >= MAX_FILES) { toast('最多 ' + MAX_FILES + ' 个文件', 'warn'); break; }
            if (f.size > MAX_SIZE) { toast(f.name + ' 超过 20MB', 'warn'); continue; }
            if (f.type && f.type.indexOf('image/') === 0 && f.size <= IMG_SIZE_LIMIT) {
                (function (file) {
                    var r = new FileReader();
                    r.onload = function () { file._data = r.result; };
                    r.readAsDataURL(file);
                })(f);
            }
            s.files.push(f);
            added++;
        }
        renderFiles();
        if (added) toast('已添加 ' + added + ' 个附件', 'ok');
        save();
    }

    function addUrl(url) {
        var s = S();
        if (!MODES[current].upload) { toast('本模式不支持上传', 'warn'); return; }
        try { new URL(url); } catch (e) { toast('URL 不合法', 'warn'); return; }
        if (s.files.length >= MAX_FILES) { toast('最多 ' + MAX_FILES + ' 个文件', 'warn'); return; }
        s.files.push(url);
        renderFiles();
        toast('已添加附件', 'ok');
        save();
    }

    function removeFile(i) {
        var s = S();
        var f = s.files[i];
        if (f instanceof File && f._thumb) URL.revokeObjectURL(f._thumb);
        s.files.splice(i, 1);
        renderFiles();
        save();
    }

    function clearFiles() {
        var s = S();
        s.files.forEach(function (f) {
            if (f instanceof File && f._thumb) URL.revokeObjectURL(f._thumb);
            if (f instanceof File) f._data = null;
        });
        s.files = [];
        renderFiles();
        save();
    }

    function renderFiles() {
        var s = S();
        preview.innerHTML = '';
        preview.classList.toggle('show', s.files.length > 0);

        s.files.forEach(function (f, i) {
            var it = document.createElement('div');
            it.className = 'att';

            var isImg = f instanceof File && f.type && f.type.indexOf('image/') === 0;
            var th = document.createElement('div');
            th.className = 'att-thumb';
            if (isImg) {
                if (!f._thumb) f._thumb = URL.createObjectURL(f);
                var img = document.createElement('img');
                img.className = 'att-thumb';
                img.src = f._thumb;
                th = img;
            } else {
                th.textContent = f instanceof File ? '📄' : '🔗';
            }

            var meta = document.createElement('div');
            meta.className = 'att-meta';
            var nm = document.createElement('span');
            nm.className = 'att-name';
            nm.textContent = fileNameOf(f);
            nm.title = f instanceof File ? f.name : f;
            var sz = document.createElement('span');
            sz.className = 'att-size';
            sz.textContent = f instanceof File ? fmtSize(f.size) : 'URL 附件';
            meta.appendChild(nm);
            meta.appendChild(sz);

            var del = document.createElement('button');
            del.className = 'att-del';
            del.textContent = '✕';
            del.addEventListener('click', function () { removeFile(i); });

            it.appendChild(th);
            it.appendChild(meta);
            it.appendChild(del);
            preview.appendChild(it);
        });
    }

    /* ============ 编辑器 ============ */
    function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }

    function openMenu() {
        if (!MODES[current].upload) { toast('本模式不支持上传', 'warn'); return; }
        menuUrl.value = '';
        menu.classList.add('open');
    }

    function closeMenu() { menu.classList.remove('open'); }

    /* ============ 事件 ============ */
    send.addEventListener('click', function () {
        if (streaming) { abortStream(); } else { doSend(); }
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !streaming) {
            e.preventDefault();
            doSend();
        }
    });

    input.addEventListener('input', function () {
        S().draft = input.value;
        autoGrow();
    });

    attach.addEventListener('click', function (e) {
        e.stopPropagation();
        openMenu();
    });

    menuLocal.addEventListener('click', function () {
        fileEl.click();
        closeMenu();
    });

    function addUrlFromMenu() {
        var v = menuUrl.value.trim();
        if (v) { addUrl(v); menuUrl.value = ''; }
    }
    menuAdd.addEventListener('click', addUrlFromMenu);
    menuUrl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); addUrlFromMenu(); }
    });

    document.addEventListener('click', function (e) {
        var inBox = composer.contains(e.target);
        if (!inBox) closeMenu();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

    fileEl.addEventListener('change', function (e) {
        if (e.target.files && e.target.files.length) {
            addFiles(Array.prototype.slice.call(e.target.files));
            fileEl.value = '';
        }
    });

    document.getElementById('theme').addEventListener('click', function () {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (dark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('ai_tutor_theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('ai_tutor_theme', 'dark');
        }
    });

    function resetCurrent(msg) {
        var s = S();
        s.messages = [];
        s.conversationId = '';
        s.files.forEach(function (f) { if (f instanceof File && f._thumb) URL.revokeObjectURL(f._thumb); });
        s.files = [];
        s.draft = '';
        input.value = '';
        autoGrow();
        renderChat();
        renderFiles();
        refreshCounts();
        save();
        if (msg) toast(msg, 'info');
    }

    document.getElementById('new-chat').addEventListener('click', function () {
        resetCurrent('「' + MODES[current].name + '」已新建对话');
    });

    document.getElementById('clear').addEventListener('click', function () {
        resetCurrent('「' + MODES[current].name + '」历史已清空');
    });

    /* 拖拽上传（限支持上传的模式） */
    var dragDeep = 0;
    app.addEventListener('dragenter', function (e) {
        e.preventDefault();
        if (MODES[current].upload && e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1) {
            dragDeep++;
            composer.classList.add('dragover');
        }
    });
    app.addEventListener('dragover', function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
    app.addEventListener('dragleave', function (e) {
        e.preventDefault();
        dragDeep = Math.max(0, dragDeep - 1);
        if (!dragDeep) composer.classList.remove('dragover');
    });
    app.addEventListener('drop', function (e) {
        e.preventDefault();
        dragDeep = 0;
        composer.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
            addFiles(Array.prototype.slice.call(e.dataTransfer.files));
        }
    });

    /* ============ 初始化 ============ */
    (function initTheme() {
        if (localStorage.getItem('ai_tutor_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();

    load();
    renderModeBar();
    input.value = sessions[current].draft;
    autoGrow();
    renderChat();
    input.focus();
})();
</script>
</body>
</html>
